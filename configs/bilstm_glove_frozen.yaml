# M4a: BiLSTM 2 chiều + GloVe 100d đóng băng (freeze)
model:
  rnn_type: "lstm"
  bidirectional: true
  embed_dim: 100
  hidden_dim: 128
  num_layers: 1
  dropout: 0.5
  pooling: "last"
  use_pretrained_embeddings: true
  freeze_embeddings: true
  glove_path: "data/glove/glove.6B.100d.txt"

data:
  max_len: 400
  batch_size: 64
  min_freq: 2
  max_vocab_size: 25000
  truncation: "post"

training:
  lr: 0.001
  weight_decay: 0.00001
  max_epochs: 20
  patience: 3
  clip_grad_norm: 5.0
